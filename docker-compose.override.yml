# Docker Compose Override for Development
# This file is automatically loaded after docker-compose.yml
# Use: docker-compose up (loads both files)

version: "3.9"

services:
  backend:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      LOG_LEVEL: DEBUG
    volumes:
      - ./src/backend:/app/src/backend
    command: >
      sh -c "
      flask db upgrade &&
      flask run --host=0.0.0.0 --port=5000
      "

  frontend:
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:5000
    command: bun run dev
    ports:
      - "5173:5173"

  # Enable admin tools in development
  adminer:
    profiles: [] # Override to enable always in dev

  redis-commander:
    profiles: [] # Override to enable always in dev

  nginx:
    profiles:
      - debug # Disable nginx in development, use direct URLs

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
