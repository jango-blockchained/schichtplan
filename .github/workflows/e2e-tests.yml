name: E2E Tests

on:
  push:
    branches: [main, develop, feature/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run E2E tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e-test:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        include:
          - browser: chromium
            device: 'Desktop Chrome'
          - browser: firefox
            device: 'Desktop Firefox'
          - browser: webkit
            device: 'Desktop Safari'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Setup test database
        run: |
          # Initialize test database
          python -c "from src.backend.app import create_app; app = create_app(); app.app_context().push()"
          flask db upgrade || echo "Database already initialized"

      - name: Start backend server
        run: |
          python -m src.backend.run runserver &
          echo $! > backend.pid
          # Wait for backend to be ready
          timeout 60 bash -c 'until curl -f http://localhost:5000/health 2>/dev/null; do sleep 2; done'
        env:
          FLASK_ENV: testing
          DATABASE_URL: sqlite:///test.db

      - name: Run E2E tests
        run: playwright test --project=${{ matrix.browser }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-results-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-failures-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

  e2e-mobile:
    name: E2E Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          cd src/frontend && bun install

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Setup test database
        run: |
          python -c "from src.backend.app import create_app; app = create_app(); app.app_context().push()"
          flask db upgrade || echo "Database already initialized"

      - name: Start backend server
        run: |
          python -m src.backend.run runserver &
          echo $! > backend.pid
          timeout 60 bash -c 'until curl -f http://localhost:5000/health 2>/dev/null; do sleep 2; done'
        env:
          FLASK_ENV: testing

      - name: Run mobile E2E tests
        run: playwright test --project='Mobile Chrome' --project='Mobile Safari' --project='iPad'
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          CI: true

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-mobile-results
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Stop backend server
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi

  e2e-report:
    name: Generate E2E Report
    needs: [e2e-test, e2e-mobile]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-results

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Playwright
        run: bun add -D @playwright/test

      - name: Merge test results
        run: |
          mkdir -p merged-results
          find all-results -name '*.json' -exec cp {} merged-results/ \;

      - name: Generate HTML report
        run: |
          bunx playwright show-report --host 0.0.0.0 &
          sleep 5
          # Report is available at http://localhost:9323

      - name: Upload combined report
        uses: actions/upload-artifact@v3
        with:
          name: e2e-test-report
          path: playwright-report/
          retention-days: 30

  e2e-summary:
    name: E2E Test Summary
    needs: [e2e-test, e2e-mobile]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ E2E tests completed across multiple browsers and devices" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Browsers Tested" >> $GITHUB_STEP_SUMMARY
          echo "- Chromium (Desktop)" >> $GITHUB_STEP_SUMMARY
          echo "- Firefox (Desktop)" >> $GITHUB_STEP_SUMMARY
          echo "- WebKit/Safari (Desktop)" >> $GITHUB_STEP_SUMMARY
          echo "- Mobile Chrome" >> $GITHUB_STEP_SUMMARY
          echo "- Mobile Safari" >> $GITHUB_STEP_SUMMARY
          echo "- iPad" >> $GITHUB_STEP_SUMMARY
