version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: schichtplan-postgres
    environment:
      POSTGRES_DB: schichtplan
      POSTGRES_USER: schichtplan_user
      POSTGRES_PASSWORD: schichtplan_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schichtplan_user -d schichtplan"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - schichtplan-network
    restart: unless-stopped

  # Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: schichtplan-redis
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - schichtplan-network
    restart: unless-stopped

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: schichtplan-backend
    environment:
      FLASK_ENV: production
      FLASK_APP: src.backend.app:create_app
      DATABASE_URL: postgresql://schichtplan_user:schichtplan_password@postgres:5432/schichtplan
      REDIS_URL: redis://:redis_password@redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_password
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/backend:/app/src/backend
      - ./instance:/app/instance
      - ./logs:/app/logs
    command: >
      sh -c "
      flask db upgrade &&
      gunicorn -w 4 -b 0.0.0.0:5000 
        --timeout 120 
        --access-logfile - 
        --error-logfile - 
        'src.backend.app:create_app()'
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - schichtplan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # MCP Server Service (AI Tool Integration)
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: schichtplan-mcp-server
    environment:
      FLASK_ENV: production
      FLASK_APP: src.backend.app:create_app
      DATABASE_URL: postgresql://schichtplan_user:schichtplan_password@postgres:5432/schichtplan
      REDIS_URL: redis://:redis_password@redis:6379/0
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./src/backend:/app/src/backend
      - ./instance:/app/instance
      - ./logs:/app/logs
    command: >
      python src/backend/mcp_server.py 
        --transport sse 
        --port 8001
    networks:
      - schichtplan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend Service
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: schichtplan-frontend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_MCP_URL: http://localhost:8001
      NODE_ENV: production
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./src/frontend/src:/app/src
      - ./src/frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    command: bun run preview
    networks:
      - schichtplan-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: schichtplan-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - schichtplan-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Adminer (Database Management UI) - Optional
  adminer:
    image: adminer:latest
    container_name: schichtplan-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - schichtplan-network
    restart: unless-stopped
    profiles:
      - debug

  # Redis Commander (Redis Management UI) - Optional
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: schichtplan-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_password
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - schichtplan-network
    restart: unless-stopped
    profiles:
      - debug

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  schichtplan-network:
    driver: bridge
